apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
  namespace: weijie
  labels:
    app: todo
    app.kubernetes.io/name: todo
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: todo
        app.kubernetes.io/name: todo
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # UBI nginx: serves /opt/app-root/src on port 8080 as an arbitrary
          # (non-root) UID, which is what the restricted-v2 SCC assigns.
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            # Mounted as a directory (not subPath) so edits to the ConfigMap
            # propagate into the running pod without a restart.
            - name: content
              mountPath: /opt/app-root/src
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: content
          configMap:
            name: todo-content
