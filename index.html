<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1b1d21;
    --muted: #8a8f98;
    --border: #e3e5e9;
    --accent: #4f6bed;
    --danger: #d5443c;
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --surface: #1e2127;
      --text: #e8eaed;
      --muted: #868b95;
      --border: #2c3038;
      --accent: #7b91f5;
      --danger: #e5635b;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 560px;
  }

  h1 {
    margin: 0 0 24px;
    font-size: 28px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }

  #new-todo {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  #new-todo:focus,
  .edit-input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid transparent;
    background: none;
    color: inherit;
  }

  .primary {
    padding: 10px 18px;
    background: var(--accent);
    color: #fff;
    font-weight: 550;
  }

  .primary:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }

  li:last-child { border-bottom: none; }

  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .label {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    cursor: text;
  }

  li.done .label {
    color: var(--muted);
    text-decoration: line-through;
  }

  .edit-input {
    flex: 1;
    min-width: 0;
    padding: 4px 8px;
    margin: -5px 0;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .delete {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    font-size: 18px;
    line-height: 1;
    color: var(--muted);
  }

  .delete:hover { color: var(--danger); }

  .empty {
    padding: 36px 14px;
    text-align: center;
    color: var(--muted);
  }

  footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    color: var(--muted);
  }

  .count { margin-right: auto; }

  .filters { display: flex; gap: 4px; }

  .filter {
    padding: 4px 10px;
    border-radius: 6px;
    color: var(--muted);
  }

  .filter:hover { background: var(--bg); }

  .filter[aria-pressed="true"] {
    color: var(--text);
    border-color: var(--border);
  }

  #clear-done {
    padding: 4px 10px;
    color: var(--muted);
  }

  #clear-done:hover { color: var(--danger); }

  #clear-done[hidden] { display: none; }

  @media (max-width: 460px) {
    footer { flex-wrap: wrap; }
    .count { width: 100%; margin-bottom: 4px; }
  }
</style>
</head>
<body>
<main>
  <h1>Todo</h1>

  <div class="card">
    <form id="new-form" autocomplete="off">
      <input id="new-todo" placeholder="What needs doing?" aria-label="New task" maxlength="500">
      <button type="submit" class="primary" disabled>Add</button>
    </form>

    <ul id="list" aria-live="polite"></ul>
    <p class="empty" id="empty" hidden></p>

    <footer>
      <span class="count" id="count"></span>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="done">Done</button>
      </div>
      <button id="clear-done" hidden>Clear done</button>
    </footer>
  </div>
</main>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "todo.items.v1";

  var todos = load();
  var filter = "all";

  var form = document.getElementById("new-form");
  var input = document.getElementById("new-todo");
  var addBtn = form.querySelector(".primary");
  var list = document.getElementById("list");
  var empty = document.getElementById("empty");
  var count = document.getElementById("count");
  var clearDone = document.getElementById("clear-done");

  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!Array.isArray(raw)) return [];
      return raw
        .filter(function (t) { return t && typeof t.text === "string"; })
        .map(function (t) {
          return { id: t.id || uid(), text: t.text, done: !!t.done };
        });
    } catch (err) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (err) {
      // Storage full or unavailable (e.g. private mode) — keep working in memory.
    }
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function visible() {
    if (filter === "active") return todos.filter(function (t) { return !t.done; });
    if (filter === "done") return todos.filter(function (t) { return t.done; });
    return todos;
  }

  function find(id) {
    return todos.filter(function (t) { return t.id === id; })[0];
  }

  function render() {
    var items = visible();

    list.textContent = "";
    items.forEach(function (todo) {
      list.appendChild(row(todo));
    });

    empty.hidden = items.length > 0;
    if (!todos.length) {
      empty.textContent = "Nothing here yet. Add your first task above.";
    } else if (filter === "active") {
      empty.textContent = "No active tasks — all caught up.";
    } else if (filter === "done") {
      empty.textContent = "No completed tasks yet.";
    }

    var left = todos.filter(function (t) { return !t.done; }).length;
    count.textContent = left === 1 ? "1 task left" : left + " tasks left";

    clearDone.hidden = todos.length === left;

    Array.prototype.forEach.call(
      document.querySelectorAll(".filter"),
      function (btn) {
        btn.setAttribute("aria-pressed", String(btn.dataset.filter === filter));
      }
    );
  }

  function row(todo) {
    var li = document.createElement("li");
    li.dataset.id = todo.id;
    if (todo.done) li.className = "done";

    var box = document.createElement("input");
    box.type = "checkbox";
    box.checked = todo.done;
    box.setAttribute("aria-label", "Mark “" + todo.text + "” as done");

    var label = document.createElement("span");
    label.className = "label";
    label.textContent = todo.text;
    label.title = "Double-click to edit";

    var del = document.createElement("button");
    del.className = "delete";
    del.type = "button";
    del.textContent = "×";
    del.setAttribute("aria-label", "Delete “" + todo.text + "”");

    li.appendChild(box);
    li.appendChild(label);
    li.appendChild(del);
    return li;
  }

  function startEdit(li, todo) {
    var label = li.querySelector(".label");
    if (!label) return;

    var field = document.createElement("input");
    field.className = "edit-input";
    field.value = todo.text;
    field.maxLength = 500;
    field.setAttribute("aria-label", "Edit task");

    var settled = false;
    function commit(keep) {
      if (settled) return;
      settled = true;
      var text = field.value.trim();
      if (keep && text) {
        todo.text = text;
        save();
      }
      render();
    }

    field.addEventListener("blur", function () { commit(true); });
    field.addEventListener("keydown", function (e) {
      if (e.key === "Enter") commit(true);
      else if (e.key === "Escape") commit(false);
    });

    li.replaceChild(field, label);
    field.focus();
    field.select();
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;

    todos.push({ id: uid(), text: text, done: false });
    input.value = "";
    addBtn.disabled = true;
    save();
    render();
  });

  input.addEventListener("input", function () {
    addBtn.disabled = !input.value.trim();
  });

  list.addEventListener("change", function (e) {
    if (e.target.type !== "checkbox") return;
    var todo = find(e.target.closest("li").dataset.id);
    if (!todo) return;
    todo.done = e.target.checked;
    save();
    render();
  });

  list.addEventListener("click", function (e) {
    var btn = e.target.closest(".delete");
    if (!btn) return;
    var id = btn.closest("li").dataset.id;
    todos = todos.filter(function (t) { return t.id !== id; });
    save();
    render();
  });

  list.addEventListener("dblclick", function (e) {
    var label = e.target.closest(".label");
    if (!label) return;
    var li = label.closest("li");
    var todo = find(li.dataset.id);
    if (todo) startEdit(li, todo);
  });

  document.querySelector(".filters").addEventListener("click", function (e) {
    var btn = e.target.closest(".filter");
    if (!btn) return;
    filter = btn.dataset.filter;
    render();
  });

  clearDone.addEventListener("click", function () {
    todos = todos.filter(function (t) { return !t.done; });
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
